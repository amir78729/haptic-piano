name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release DMG
    runs-on: macos-13

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build app bundle
        run: make build

      - name: Package DMG
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT="HapticPiano-${VERSION}.dmg"
          STAGING_DIR="release/Haptic Piano"

          rm -rf release
          mkdir -p "$STAGING_DIR"
          cp -R build/HapticPiano.app "$STAGING_DIR/HapticPiano.app"
          ln -s /Applications "$STAGING_DIR/Applications"

          hdiutil create \
            -volname "Haptic Piano" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "release/$ARTIFACT"

          shasum -a 256 "release/$ARTIFACT" > "release/$ARTIFACT.sha256"
          echo "artifact=release/$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "checksum=release/$ARTIFACT.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.artifact }}" \
            "${{ steps.package.outputs.checksum }}" \
            --title "Haptic Piano $GITHUB_REF_NAME" \
            --generate-notes
